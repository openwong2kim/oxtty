name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p wongtty -p wongtty-wasm -p wongtty-node -p wongtty-web --check  # src/vt is #[rustfmt::skip]
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p wongtty

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: bash scripts/build-wasm.sh
      - run: bash scripts/build-web.sh
      - run: npm ci
        working-directory: packages/wongtty
      - run: npm test
        working-directory: packages/wongtty
      - run: npm run test:web
        working-directory: packages/wongtty
      - run: bash scripts/build-node.sh
      - run: node --test crates/wongtty-node/test.cjs

  node-binding:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-node.sh
        shell: bash
      - run: node --test crates/wongtty-node/test.cjs
